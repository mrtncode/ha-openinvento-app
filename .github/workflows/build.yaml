name: Build Home Assistant app

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      version:
        description: App version and image tag to build
        required: false
        type: string
      source_ref:
        description: Git ref containing the app version to build
        required: false
        type: string

permissions:
  contents: read

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: ha-openinvento-app

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.event.release.tag_name }}
      - name: Prepare architecture matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.event.release.tag_name }}
      - name: Build and publish architecture image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ inputs.version || github.event.release.tag_name }}
            latest
          cosign: "false"
          push: "true"
          version: ${{ inputs.version || github.event.release.tag_name }}

  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-architecture manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          cosign: "false"
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ inputs.version || github.event.release.tag_name }}
            latest
